name: Build

# One run per push: a merged PR is a single push, however many commits it carries.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref cancels the older in-progress build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macos-latest is arm64 (Apple Silicon); maker-dmg needs macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26 # Forge 8 needs >= 22.13
          cache: npm

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### sky-toppower-psu $version (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci

      - run: npm test

      # Electron's install script doesn't run under npm ci (allowScripts), so Forge would download
      # the zip itself, and GitHub release downloads 504 at times. Prefetch it (GitHub, else a
      # mirror; validated against electron/checksums.json either way) and cache it between runs.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Fetch Electron
        run: node scripts/fetch-electron.mjs "$RUNNER_TEMP/electron-zips" arm64

      # Developer ID cert (MACOS_CERT_P12 = base64 .p12) into a throwaway keychain. Without it the
      # build is labelled UNSIGNED (artifact name + summary) rather than quietly shipping unsigned.
      - name: Import signing certificate
        id: sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::MACOS_CERT_P12 not set, building UNSIGNED"
            echo "suffix=-UNSIGNED" >> "$GITHUB_OUTPUT"
            echo "**UNSIGNED build** (no MACOS_CERT_P12 secret)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"; kcpass=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          # Prepend to the search list so codesign finds the identity.
          existing=()
          while IFS= read -r k; do existing+=("$(echo "$k" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$kc" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # forge.config.js signs when APP_IDENTITY is set and notarizes when the APPLE_* trio is too.
      - name: Build
        env:
          ELECTRON_ZIP_DIR: ${{ runner.temp }}/electron-zips
          APP_IDENTITY: ${{ steps.sign.outputs.signed && secrets.APP_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run make

      - name: Verify signature and notarization
        if: steps.sign.outputs.signed
        run: |
          app=$(find out -maxdepth 2 -name '*.app' -type d | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Clean up keychain
        if: always() && steps.sign.outputs.signed
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db"

      # Forge names the zip and dmg from package.json's version; fail if that ever changes.
      - name: Check artifact names carry the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          find out/make -type f \( -name '*.zip' -o -name '*.dmg' \) > files.txt
          cat files.txt
          test -s files.txt
          if grep -vF -- "-$VERSION" files.txt; then
            echo "::error::artifact names above lack version $VERSION"
            exit 1
          fi
          sed 's/^/- /' files.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: sky-toppower-psu-${{ steps.version.outputs.version }}-macos-arm64${{ steps.sign.outputs.suffix }}
          path: |
            out/make/**/*.zip
            out/make/**/*.dmg
          if-no-files-found: error
